<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title></title>
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div id="stats"></div>
    <div class="controls">
      <button id="walk" class="ctl" aria-label="Walk out into town">Walk</button>
      <button id="to-menu" class="ctl" aria-label="Back to the main menu">Menu</button>
    </div>
  </header>
  <div id="toast" class="toast" hidden></div>
  <main>
    <div id="city">
      <div id="walk-ui" hidden>
        <div id="stick"><div id="knob"></div></div>
        <button id="office" class="walk-ctl">Office</button>
        <button id="run" class="walk-ctl" aria-pressed="false">Run</button>
        <button id="talk" class="action" disabled>Talk</button>
        <button id="collect" class="action" disabled>Collect</button>
      </div>
    </div>
    <div id="dock">
      <button id="dock-toggle" class="dock-toggle" aria-expanded="true" aria-controls="panel">Hide panel ▾</button>
      <section id="panel"></section>
    </div>
  </main>

  <!-- The main menu: shown when the page opens without a game picked. -->
  <div id="menu" class="menu">
    <section data-screen="main" class="menu-screen">
      <button data-go="start" class="menu-btn primary">Start game</button>
      <button data-go="load" class="menu-btn">Load game</button>
      <button data-go="settings" class="menu-btn">Settings</button>
    </section>

    <section data-screen="start" class="menu-screen" hidden>
      <h2>Start a new game</h2>
      <p class="hint">Pick a slot. A slot with a saved game is replaced.</p>
      <button data-slot="1" data-mode="start" class="menu-btn slot"></button>
      <button data-slot="2" data-mode="start" class="menu-btn slot"></button>
      <button data-slot="3" data-mode="start" class="menu-btn slot"></button>
      <button data-go="main" class="menu-btn">Back</button>
    </section>

    <section data-screen="load" class="menu-screen" hidden>
      <h2>Load a game</h2>
      <button data-slot="1" data-mode="load" class="menu-btn slot"></button>
      <button data-slot="2" data-mode="load" class="menu-btn slot"></button>
      <button data-slot="3" data-mode="load" class="menu-btn slot"></button>
      <button data-go="main" class="menu-btn">Back</button>
    </section>

    <section data-screen="settings" class="menu-screen" hidden>
      <h2>Settings</h2>
      <label class="menu-slider">Master volume <output data-out="master"></output>
        <input type="range" min="0" max="100" data-setting="master">
      </label>
      <label class="menu-slider">Music <output data-out="music"></output>
        <input type="range" min="0" max="100" data-setting="music">
      </label>
      <label class="menu-slider">Sound effects <output data-out="sound"></output>
        <input type="range" min="0" max="100" data-setting="sound">
      </label>
      <button data-go="main" class="menu-btn">Back</button>
    </section>
  </div>

  <script src="vendor/three.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
