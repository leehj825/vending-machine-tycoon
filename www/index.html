<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Vending Machine Tycoon</title>
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="brand">Vending Machine Tycoon</div>
    <div id="stats"></div>
    <div class="controls">
      <button id="pause" class="ctl" aria-label="Pause or play">❚❚</button>
      <button id="speed" class="ctl" aria-label="Game speed">1×</button>
      <button id="walk" class="ctl" aria-label="Walk out into town">Walk</button>
    </div>
  </header>
  <div id="toast" class="toast" hidden></div>
  <main>
    <div id="city">
      <div id="walk-ui" hidden>
        <div id="stick"><div id="knob"></div></div>
        <button id="office" class="walk-ctl">Office</button>
        <button id="run" class="walk-ctl" aria-pressed="false">Run</button>
        <button id="talk" class="action" disabled>Talk</button>
        <button id="collect" class="action" disabled>Collect</button>
      </div>
    </div>
    <section id="panel"></section>
  </main>
  <script src="vendor/three.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
