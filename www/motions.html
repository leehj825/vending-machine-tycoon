<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Motion preview</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { display: block; overflow: auto; touch-action: auto; user-select: auto; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 12px; }
    #view { width: 100%; height: 360px; border: 1px solid var(--line); border-radius: 10px; background: #a7d8f2; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
    select, input[type=range] { font: inherit; min-height: 40px; }
    select { flex: 1; min-width: 180px; padding: 6px; border-radius: 8px; border: 1px solid var(--line); }
    .label { font-weight: 700; }
    .hint { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Motion preview</h2>
    <p class="hint">Every human motion from Nightfall Settlement and Deepward, one figure. Pick a motion to play it.</p>
    <div id="view"></div>
    <div class="bar">
      <select id="pick" aria-label="Motion"></select>
      <button id="play" class="primary">Pause</button>
      <label>Speed <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1"></label>
    </div>
    <div class="bar"><span class="label" id="name"></span><span class="hint" id="info"></span></div>
  </div>
  <script src="vendor/three.min.js"></script>
  <script type="module" src="js/preview.js"></script>
</body>
</html>
