<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>City</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #A7D8F2; touch-action: none; }
    #host { position: fixed; inset: 0; }
    canvas { display: block; }
    /* The player's stick, bottom left, and the talk and collect buttons. */
    #stick { position: fixed; left: 24px; bottom: 24px; width: 120px; height: 120px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.22); border: 2px solid rgba(255, 255, 255, 0.6); touch-action: none; }
    #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
      border-radius: 50%; background: rgba(255, 255, 255, 0.75); pointer-events: none; }
    #talkBtn { transform: translateX(calc(-100% - 8px)); }
    #collectBtn { transform: translateX(8px); }
    .action { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); display: none;
      padding: 12px 24px; border: none; border-radius: 24px; background: #FFC107; color: #1A1008;
      font: 700 16px sans-serif; touch-action: manipulation; }
  </style>
</head>
<body>
  <div id="host"></div>
  <div id="stick" style="display:none"><div id="knob"></div></div>
  <button id="talkBtn" class="action" style="display:none">Talk</button>
  <button id="collectBtn" class="action" style="display:none">Collect</button>
  <script src="three.min.js"></script>
  <script src="city.js"></script>
</body>
</html>
