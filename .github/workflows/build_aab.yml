name: Build and Sign AAB

on:
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub UI
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Change to '11' or '21' if your project requires an older/newer JDK
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        # Decodes the base64 string and saves it as a temporary file in the build runner
        run: echo $KEYSTORE_B64 | base64 --decode > release.jks

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Compiles the AAB and overrides the signing config to use your GitHub Secrets
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-app-bundle
          # The exact path where Gradle outputs the AAB. 
          # Note: If using React Native, change to: android/app/build/outputs/bundle/release/*.aab
          path: app/build/outputs/bundle/release/*.aab
