name: Build and Sign Android AAB

on:
  push:
    branches:
      - '**'
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        # Updated: Saves the keystore to android/release.jks to match Gradle's search path
        run: echo $KEYSTORE_B64 | base64 --decode > android/release.jks
  
      - name: Create key.properties for signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Creates the standard Flutter configuration file to securely pass passwords to Gradle
        run: |
          cat << EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF

      - name: Clean project
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test test/contract_test.dart test/pricing_test.dart test/security_test.dart test/rival_test.dart

      - name: Build Release AAB
        run: flutter build appbundle --release

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          # The exact path where Flutter outputs the finished app bundle
          path: build/app/outputs/bundle/release/app-release.aab
